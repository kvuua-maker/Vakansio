name: Create App Store subscriptions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-subscriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.ASK_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY || secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Pro and Business subscriptions
        run: node scripts/asc-create-subscriptions.mjs
